name: Vibes
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Vibes:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yoyovich.vibes
        PRODUCT_NAME: Vibes
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Vibes
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIRequiresFullScreen: false
  VibesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Vibes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yoyovich.vibes.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vibes:
    build:
      targets:
        Vibes: all
    test:
      targets:
        - VibesUITests
